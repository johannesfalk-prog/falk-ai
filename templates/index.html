<!DOCTYPE html>
<html lang="sv" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FALK - Sokratisk CBT Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen max-h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header (Låst i toppen) -->
    <header class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950 flex-shrink-0">
        <div class="flex items-center space-x-3">
            <h1 class="text-2xl font-bold tracking-wider text-amber-500">FALK</h1>
            <span id="tier-badge" class="text-xs font-semibold px-2.5 py-0.5 rounded bg-slate-800 text-slate-400">FREE</span>
        </div>
        <div id="auth-section">
            <button id="login-btn" onclick="openAuthModal()" class="bg-amber-600 hover:bg-amber-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition">
                Logga in / Skapa konto
            </button>
            <div id="user-info" class="hidden flex items-center space-x-3">
                <span id="user-email" class="text-sm text-slate-400"></span>
                <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm px-3 py-1.5 rounded-lg border border-slate-700 transition">
                    Logga ut
                </button>
            </div>
        </div>
    </header>

    <!-- Main Chat Container (Låst höjd, isolerad chatt-scroll) -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col min-h-0 overflow-hidden">
        <!-- Chat Box (Enda elementet som får scrolla) -->
        <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4 min-h-0">
            <div class="bg-slate-800/60 border border-slate-700/50 p-4 rounded-xl text-slate-300 text-sm">
                <p class="font-semibold text-amber-400 mb-1">FALK READY</p>
                <p>Välkommen. Beskriv vad du bär på just nu.</p>
            </div>
        </div>

        <!-- Input Form (Låst i botten) -->
        <form id="chat-form" onsubmit="sendMessage(event)" class="flex space-x-2 flex-shrink-0">
            <input type="text" id="message-input" placeholder="Beskriv din tanke..." 
                   class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-amber-500 text-sm transition">
            <button type="submit" id="send-btn" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold px-6 py-3 rounded-xl text-sm transition disabled:opacity-50">
                Skicka
            </button>
        </form>
    </main>

    <!-- Paywall Modal -->
    <div id="paywall-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-900 border border-amber-500/30 p-6 rounded-2xl max-w-md w-full shadow-2xl text-center space-y-4">
            <div class="w-12 h-12 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                🔒
            </div>
            <h2 class="text-xl font-bold text-white">Daglig gräns nådd</h2>
            <p id="paywall-message" class="text-slate-300 text-sm">
                Du har nått din dagliga gräns på 5 meddelanden. Uppgradera till PRO för obegränsade samtalsstunder och personligt minne.
            </p>
            
            <div id="modal-auth-form" class="hidden space-y-3 text-left">
                <p class="text-xs text-amber-400 font-semibold text-center">Ange e-post för att skapa konto/logga in och fortsätta:</p>
                <input type="email" id="modal-email" placeholder="Din e-postadress" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                <input type="password" id="modal-password" placeholder="Välj ett lösenord (minst 6 tecken)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
            </div>

            <div class="pt-2 flex flex-col space-y-2">
                <button onclick="upgradeToPro()" id="upgrade-btn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-xl transition text-sm">
                    Uppgradera till PRO (199 SEK/mån)
                </button>
                <button onclick="closePaywall()" class="text-slate-400 hover:text-slate-200 text-xs py-2 transition">
                    Jag väntar till imorgon
                </button>
            </div>
        </div>
    </div>

    <!-- Auth Modal (standalone) -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl max-w-sm w-full space-y-4">
            <h2 class="text-lg font-bold text-white text-center">Logga in / Skapa konto</h2>
            <div class="space-y-3">
                <input type="email" id="auth-email" placeholder="E-post" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                <input type="password" id="auth-password" placeholder="Lösenord" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex space-x-2 pt-2">
                <button onclick="handleAuth('login')" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2 rounded-xl text-sm transition">Logga in</button>
                <button onclick="handleAuth('signup')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2 rounded-xl text-sm border border-slate-700 transition">Skapa konto</button>
            </div>
            <button onclick="closeAuthModal()" class="w-full text-center text-slate-500 text-xs mt-2 hover:text-slate-300">Avbryt</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "{{ supabase_url }}";
        const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
        
        let supabaseClient = null;
        if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let userToken = null;

        async function initAuth() {
            if (!supabaseClient) return;

            const { data: { session } } = await supabaseClient.auth.getSession();
            updateAuthUI(session);

            supabaseClient.auth.onAuthStateChange((_event, session) => {
                updateAuthUI(session);
            });
        }

        function updateAuthUI(session) {
            const loginBtn = document.getElementById('login-btn');
            const userInfo = document.getElementById('user-info');
            const userEmail = document.getElementById('user-email');
            const tierBadge = document.getElementById('tier-badge');
            const modalAuthForm = document.getElementById('modal-auth-form');

            if (session) {
                userToken = session.access_token;
                loginBtn.classList.add('hidden');
                userInfo.classList.remove('hidden');
                userEmail.textContent = session.user.email;
                tierBadge.textContent = "INLOGGAD";
                tierBadge.className = "text-xs font-semibold px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30";
                if (modalAuthForm) modalAuthForm.classList.add('hidden');
            } else {
                userToken = null;
                loginBtn.classList.remove('hidden');
                userInfo.classList.add('hidden');
                tierBadge.textContent = "FREE";
                tierBadge.className = "text-xs font-semibold px-2.5 py-0.5 rounded bg-slate-800 text-slate-400";
            }
        }

        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('hidden');
        }

        async function handleAuth(type) {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();

            if (!email || !password) {
                alert("Fyll i både e-post och lösenord.");
                return;
            }

            let res;
            if (type === 'signup') {
                res = await supabaseClient.auth.signUp({ email, password });
            } else {
                res = await supabaseClient.auth.signInWithPassword({ email, password });
            }

            if (res.error) {
                alert("Fel: " + res.error.message);
            } else {
                closeAuthModal();
            }
        }

        async function logout() {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            userToken = null;
            localStorage.clear();
            sessionStorage.clear();
            window.location.reload();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const btn = document.getElementById('send-btn');
            const message = input.value.trim();

            if (!message) return;

            appendMessage('Du', message, 'user');
            input.value = '';
            btn.disabled = true;

            try {
                const headers = { 'Content-Type': 'application/json' };
                if (userToken) headers['Authorization'] = `Bearer ${userToken}`;

                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ message: message })
                });

                const data = await res.json();

                if (res.status === 429) {
                    showPaywall(data.error);
                    btn.disabled = false;
                    return;
                }

                if (!res.ok) {
                    appendMessage('FALK', data.error || 'Ett fel uppstod.', 'error');
                } else {
                    appendMessage('FALK', data.response, 'bot');
                }
            } catch (err) {
                appendMessage('FALK', 'Kunde inte ansluta till servern.', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        function appendMessage(sender, text, type) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            
            if (type === 'user') {
                div.className = "bg-amber-950/40 border border-amber-800/40 p-4 rounded-xl text-amber-100 text-sm ml-8";
            } else if (type === 'bot') {
                div.className = "bg-slate-800/80 border border-slate-700/80 p-4 rounded-xl text-slate-200 text-sm mr-8";
            } else {
                div.className = "bg-rose-950/40 border border-rose-800/40 p-4 rounded-xl text-rose-200 text-sm";
            }

            div.innerHTML = `<p class="font-semibold text-xs mb-1 opacity-70">${sender}</p><p>${text}</p>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function showPaywall(msg) {
            if (msg) document.getElementById('paywall-message').textContent = msg;
            const modalAuthForm = document.getElementById('modal-auth-form');
            if (!userToken) {
                modalAuthForm.classList.remove('hidden');
            } else {
                modalAuthForm.classList.add('hidden');
            }
            document.getElementById('paywall-modal').classList.remove('hidden');
        }

        function closePaywall() {
            document.getElementById('paywall-modal').classList.add('hidden');
        }

        async function upgradeToPro() {
            const upgradeBtn = document.getElementById('upgrade-btn');

            if (!userToken) {
                const email = document.getElementById('modal-email').value.trim();
                const password = document.getElementById('modal-password').value.trim();

                if (!email || !password) {
                    alert("Fyll i e-post och lösenord för att skapa ditt konto och fortsätta till betalning.");
                    return;
                }

                upgradeBtn.disabled = true;
                upgradeBtn.textContent = "Skapar konto...";

                let authRes = await supabaseClient.auth.signInWithPassword({ email, password });
                if (authRes.error) {
                    authRes = await supabaseClient.auth.signUp({ email, password });
                }

                if (authRes.error) {
                    alert("Kunde inte autentisera: " + authRes.error.message);
                    upgradeBtn.disabled = false;
                    upgradeBtn.textContent = "Uppgradera till PRO (199 SEK/mån)";
                    return;
                }

                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) {
                    userToken = session.access_token;
                }
            }

            upgradeBtn.disabled = true;
            upgradeBtn.textContent = "Förbereder betalning...";

            try {
                const res = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${userToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await res.json();

                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert("Kunde inte starta betalningen: " + (data.error || "Okänt fel"));
                    upgradeBtn.disabled = false;
                    upgradeBtn.textContent = "Uppgradera till PRO (199 SEK/mån)";
                }
            } catch (e) {
                alert("Nätverksfel vid kontakt med betaltjänsten.");
                upgradeBtn.disabled = false;
                upgradeBtn.textContent = "Uppgradera till PRO (199 SEK/mån)";
            }
        }

        initAuth();
    </script>
</body>
</html>
