<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falk Core Engine - Live Mentor Chat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background-color: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.25rem; color: #38bdf8; font-weight: 600; }
        .stage-badge { background-color: #0369a1; color: #e0f2fe; padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem; font-weight: 500; }
        #chat-container { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 80%; padding: 14px 18px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; }
        .user { align-self: flex-end; background-color: #0284c7; color: white; border-bottom-right-radius: 2px; }
        .falk { align-self: flex-start; background-color: #1e293b; color: #e2e8f0; border: 1px solid #334155; border-bottom-left-radius: 2px; }
        #input-container { padding: 16px 24px; background-color: #1e293b; border-top: 1px solid #334155; display: flex; gap: 12px; }
        input { flex: 1; background-color: #0f172a; border: 1px solid #334155; color: white; padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; outline: none; }
        input:focus { border-color: #38bdf8; }
        button { background-color: #0284c7; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #0369a1; }
        button.reset { background-color: #475569; }
        button.reset:hover { background-color: #334155; }
    </style>
</head>
<body>
    <header>
        <h1>🦅 Falk Core Engine v1.0.0</h1>
        <div>Fas: <span id="stage" class="stage-badge">TRYGGHET</span></div>
    </header>
    <div id="chat-container">
        <div class="message falk">
            Välkommen. Jag är Falk, din digitala mentor bakom WAYJS. Vad har du på hjärtat idag?
        </div>
    </div>
    <div id="input-container">
        <input type="text" id="msg-input" placeholder="Skriv ditt meddelande till Falk..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Skicka</button>
        <button class="reset" onclick="resetSession()">Nollställ Session</button>
    </div>

    <script>
        const userId = "11111111-2222-3333-4444-555555555555";
        let sessionId = localStorage.getItem("falk_session_id") || crypto.randomUUID();
        localStorage.setItem("falk_session_id", sessionId);

        async function sendMessage() {
            const input = document.getElementById("msg-input");
            const text = input.value.trim();
            if (!text) return;

            appendMessage("user", text);
            input.value = "";

            try {
                const res = await fetch("/api/dialogue/turn", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ user_id: userId, session_id: sessionId, message: text })
                });
                const data = await res.json();
                if (data.status === "success") {
                    appendMessage("falk", data.reply);
                    document.getElementById("stage").innerText = data.stage || "TRYGGHET";
                } else {
                    appendMessage("falk", "⚠️ [Fel]: " + (data.error || "Något gick fel."));
                }
            } catch (err) {
                appendMessage("falk", "⚠️ Anslutningsfel till Falk Engine.");
            }
        }

        async function resetSession() {
            try {
                await fetch("/api/dialogue/reset", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId })
                });
                sessionId = crypto.randomUUID();
                localStorage.setItem("falk_session_id", sessionId);
                document.getElementById("chat-container").innerHTML = '<div class="message falk">Sessionen har nollställts. Vad vill du utforska nu?</div>';
                document.getElementById("stage").innerText = "TRYGGHET";
            } catch (err) {
                alert("Kunde inte nollställa sessionen.");
            }
        }

        function appendMessage(sender, text) {
            const container = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
