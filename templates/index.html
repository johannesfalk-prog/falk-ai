<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALK - Kognitiv Mentor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-light: #38bdf8;
            --accent-pro: #f59e0b;
            --danger: #ef4444;
            --user-msg: #334155;
            --bot-msg: #1e293b;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-zone { display: flex; align-items: center; gap: 0.75rem; }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 2px; }
        
        .tier-badge {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tier-badge.light { background-color: var(--accent-light); color: #0f172a; }
        .tier-badge.pro { background-color: var(--accent-pro); color: #0f172a; }

        .auth-zone { display: flex; align-items: center; gap: 0.5rem; }
        input.auth-input {
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 0.8rem;
            width: 130px;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 80%;
            padding: 1rem 1.25rem;
            border-radius: 8px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user { align-self: flex-end; background-color: var(--user-msg); }
        .message.falk { align-self: flex-start; background-color: var(--bot-msg); border: 1px solid var(--border); }
        .message.error { align-self: center; background-color: rgba(239, 68, 68, 0.1); border: 1px solid var(--danger); color: var(--danger); }

        .meta-info {
            font-size: 0.7rem;
            color: var(--accent-light);
            margin-bottom: 0.4rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .meta-info.pro-meta { color: var(--accent-pro); }

        #input-form {
            padding: 1.25rem 1.5rem;
            border-top: 1px solid var(--border);
            background-color: var(--card-bg);
            display: flex;
            gap: 0.75rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.85rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        button {
            padding: 0.85rem 1.2rem;
            border-radius: 6px;
            border: none;
            background-color: var(--accent-light);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <div class="brand-zone">
            <h1>FALK</h1>
            <span id="tier-badge" class="tier-badge light">LIGHT (GRATIS)</span>
        </div>
        <div class="auth-zone" id="auth-controls">
            <input type="email" id="email-input" class="auth-input" placeholder="E-post...">
            <input type="password" id="pass-input" class="auth-input" placeholder="Lösenord...">
            <button type="button" id="login-btn" style="padding: 0.4rem 0.6rem; font-size: 0.75rem;">Logga in / Skapa</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="message falk">
            <div class="meta-info">FALK READY</div>
            Jag är FALK. Logga in ovan för att låsa upp PRO och ditt personliga vektorminne.
        </div>
    </div>

    <form id="input-form">
        <input type="text" id="message-input" placeholder="Beskriv din tanke..." autocomplete="off" required>
        <button type="submit" id="send-btn">Skicka</button>
    </form>

    <script>
        // Dynamisk inläsning från Flask render_template:
        const SUPABASE_URL = "{{ supabase_url }}";
        const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}"; 
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const chatContainer = document.getElementById('chat-container');
        const form = document.getElementById('input-form');
        const input = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const tierBadge = document.getElementById('tier-badge');
        const authControls = document.getElementById('auth-controls');

        let currentSession = null;

        _supabase.auth.getSession().then(({ data: { session } }) => {
            if (session) setSessionUI(session);
        });

        function setSessionUI(session) {
            currentSession = session;
            if (session) {
                tierBadge.textContent = 'PRO (INLOGGAD)';
                tierBadge.className = 'tier-badge pro';
                authControls.innerHTML = `<span style="font-size:0.75rem; color:var(--text-sub);">${session.user.email}</span>
                    <button type="button" onclick="logout()" style="padding:0.3rem 0.5rem; font-size:0.75rem; background:var(--danger); color:white;">Logga ut</button>`;
            } else {
                tierBadge.textContent = 'LIGHT (GRATIS)';
                tierBadge.className = 'tier-badge light';
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            location.reload();
        }

        document.getElementById('login-btn')?.addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('pass-input').value.trim();

            if (!email || !password) {
                alert('Fyll i både e-post och lösenord.');
                return;
            }

            let { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            
            if (error && error.message.includes("Invalid login credentials")) {
                const signup = await _supabase.auth.signUp({ email, password });
                if (signup.error) {
                    alert(`[FEL]: ${signup.error.message}`);
                    return;
                }
                data = signup.data;
                alert('Konto skapat och inloggad!');
            } else if (error) {
                alert(`[INLOGGNINGSFEL]: ${error.message}`);
                return;
            }

            if (data.session) {
                setSessionUI(data.session);
            }
        });

        function appendMessage(sender, text, metaText = null) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            
            if (metaText) {
                const meta = document.createElement('div');
                meta.classList.add('meta-info');
                if (metaText.includes('PRO')) meta.classList.add('pro-meta');
                meta.textContent = metaText;
                msgDiv.appendChild(meta);
            }

            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            msgDiv.appendChild(textDiv);

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';
            input.disabled = true;
            sendBtn.disabled = true;

            const headers = { 'Content-Type': 'application/json' };
            if (currentSession?.access_token) {
                headers['Authorization'] = `Bearer ${currentSession.access_token}`;
            }

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();

                if (response.status === 429) {
                    appendMessage('error', `[RATE LIMIT]: ${data.error}`);
                    return;
                }

                if (response.ok) {
                    const meta = data.tier === 'PRO' 
                        ? `FALK PRO (Minnen hämtade: ${data.memories_retrieved})`
                        : 'FALK LIGHT';
                    appendMessage('falk', data.response, meta);
                } else {
                    appendMessage('error', `[SYSTEMFEL]: ${data.error || 'Okänt fel.'}`);
                }
            } catch (err) {
                appendMessage('error', `[NÄTVERKSFEL]: Kunde inte ansluta till FALK backend.`);
            } finally {
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        });
    </script>
</body>
</html>
