<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALK - Sokratisk AI-Guide</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation -->
    <header class="border-b border-slate-800 bg-slate-950/50 p-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-bold tracking-wider text-amber-500">FALK</h1>
            <span id="tier-badge" class="text-xs px-2 py-1 rounded font-semibold bg-slate-800 text-slate-400">FREE</span>
        </div>
        <div id="auth-buttons">
            <button onclick="loginWithMagicLink()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-1.5 rounded font-medium transition">
                Logga in med Magic Link
            </button>
        </div>
    </header>

    <!-- Chat Area -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 flex flex-col">
        <div id="chat-window" class="flex-1 space-y-4 overflow-y-auto mb-4 p-4 rounded-xl bg-slate-950/30 border border-slate-800/80">
            <div class="bg-slate-800/50 p-4 rounded-lg max-w-[85%] border border-slate-700/50">
                <p class="text-xs font-semibold text-amber-500 mb-1">FALK READY</p>
                <p class="text-sm">Jag är FALK. Logga in ovan för att låsa upp PRO och ditt personliga vektorminne.</p>
            </div>
        </div>

        <!-- Input Form -->
        <form id="chat-form" onsubmit="sendMessage(event)" class="flex gap-2">
            <input type="text" id="user-input" placeholder="Beskriv din tanke..." 
                   class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 transition">
            <button type="submit" id="send-btn" class="bg-amber-600 hover:bg-amber-500 text-white font-medium px-6 py-3 rounded-xl text-sm transition">
                Skicka
            </button>
        </form>
    </main>

    <script>
        const SUPABASE_URL = "{{ supabase_url }}";
        const SUPABASE_ANON_KEY = "{{ supabase_anon_key }}";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function updateAuthUI() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const badge = document.getElementById("tier-badge");
            const authBtns = document.getElementById("auth-buttons");

            if (session) {
                badge.textContent = "PRO INLOGGAD";
                badge.className = "text-xs px-2 py-1 rounded font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30";
                authBtns.innerHTML = `
                    <span class="text-xs text-slate-400 mr-3">${session.user.email}</span>
                    <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded transition">Logga ut</button>
                `;
            } else {
                badge.textContent = "FREE";
                badge.className = "text-xs px-2 py-1 rounded font-semibold bg-slate-800 text-slate-400";
                authBtns.innerHTML = `
                    <button onclick="loginWithMagicLink()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs px-3 py-1.5 rounded font-medium transition">Logga in med Magic Link</button>
                `;
            }
        }

        async function loginWithMagicLink() {
            const email = prompt("Skriv in din e-post för Magic Link:");
            if (!email) return;
            const { error } = await supabaseClient.auth.signInWithOtp({ email });
            if (error) alert("Fel: " + error.message);
            else alert("Kolla din e-post efter inloggningslänken!");
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            updateAuthUI();
        }

        async function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById("user-input");
            const msg = input.value.trim();
            if (!msg) return;

            appendMessage("user", msg);
            input.value = "";

            const { data: { session } } = await supabaseClient.auth.getSession();
            const headers = { "Content-Type": "application/json" };
            
            if (session && session.access_token) {
                headers["Authorization"] = `Bearer ${session.access_token}`;
            }

            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: headers,
                    body: JSON.stringify({ message: msg })
                });

                const data = await res.json();
                if (res.ok) {
                    appendMessage("assistant", data.response);
                } else {
                    appendMessage("assistant", "Fel: " + (data.error || "Okänt fel uppstod"));
                }
            } catch (err) {
                appendMessage("assistant", "Kommunikationsfel med servern.");
            }
        }

        function appendMessage(role, text) {
            const win = document.getElementById("chat-window");
            const div = document.createElement("div");
            if (role === "user") {
                div.className = "bg-amber-600/20 text-slate-100 p-3 rounded-lg max-w-[85%] ml-auto border border-amber-500/30 text-sm";
            } else {
                div.className = "bg-slate-800/50 text-slate-100 p-3 rounded-lg max-w-[85%] border border-slate-700/50 text-sm";
            }
            div.textContent = text;
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        supabaseClient.auth.onAuthStateChange(() => updateAuthUI());
        updateAuthUI();
    </script>
</body>
</html>
