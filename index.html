<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FALK – Kognitiv Samtalspartner</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #6366f1; --accent: #22c55e; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; }
    .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
    input, button { width: 100%; padding: 12px; margin-top: 8px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { background: var(--primary); border: none; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-box { height: 350px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 10px; background: #0f172a; border-radius: 8px; }
    .msg { padding: 10px 14px; border-radius: 8px; max-width: 80%; word-break: break-word; }
    .msg.user { background: var(--primary); align-self: flex-end; }
    .msg.falk { background: #334155; align-self: flex-start; }
    .status { font-size: 0.85em; color: #94a3b8; text-align: center; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h2>FALK <small style="font-size: 0.5em; color: var(--accent);">[AI Expert Version]</small></h2>

  <!-- AUTH SECTION -->
  <div id="auth-section" class="card">
    <h3 id="auth-title">Logga in</h3>
    <input type="email" id="email" placeholder="Din e-postadress">
    <input type="password" id="password" placeholder="Ditt lösenord">
    <button id="btn-auth" onclick="handleAuth()">Logga in</button>
    <p class="status" onclick="toggleAuthMode()" style="cursor:pointer; text-decoration:underline;" id="toggle-auth-text">
      Inget konto? Registrera dig här.
    </p>
  </div>

  <!-- CHAT SECTION -->
  <div id="chat-section" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span id="user-display" class="status"></span>
      <button onclick="handleLogout()" style="width:auto; padding:6px 12px; font-size:0.8em;">Logga ut</button>
    </div>
    <div id="chat-box" class="chat-box"></div>
    <div style="display:flex; gap:8px;">
      <input type="text" id="chat-input" placeholder="Skriv ditt meddelande till FALK..." onkeydown="if(event.key==='Enter') sendChat()">
      <button id="btn-send" onclick="sendChat()" style="width:100px;">Skicka</button>
    </div>
    <p id="chat-status" class="status"></p>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://drmwtxoseogldbrjifks.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRybXd0eG9zZW9nbGRicmpsZmtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MDk3MTYsImV4cCI6MjEwNzk4NTcxNn0.aP-Kl9p6b1-KyioD5nH1l7IZ6B3BVU-jx160pFk95tE'; 
  const BACKEND_URL = 'https://falk-ai.onrender.com/chat';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  let isSignUpMode = false;

  // 1. Lyssna på Auth-tillstånd
  supabaseClient.auth.onAuthStateChange((event, session) => {
    if (session) {
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('chat-section').classList.remove('hidden');
      document.getElementById('user-display').innerText = session.user.email;
    } else {
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('chat-section').classList.add('hidden');
    }
  });

  function toggleAuthMode() {
    isSignUpMode = !isSignUpMode;
    document.getElementById('auth-title').innerText = isSignUpMode ? 'Skapa Konto' : 'Logga in';
    document.getElementById('btn-auth').innerText = isSignUpMode ? 'Registrera' : 'Logga in';
    document.getElementById('toggle-auth-text').innerText = isSignUpMode ? 'Har du redan konto? Logga in.' : 'Inget konto? Registrera dig här.';
  }

  async function handleAuth() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    if (!email || !password) return alert('Fyll i både e-post och lösenord.');

    if (isSignUpMode) {
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      if (error) alert('Registreringsfel: ' + error.message);
      else alert('Konto skapat! Om e-postbekräftelse krävs, kolla din inkorg.');
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert('Inloggningsfel: ' + error.message);
    }
  }

  async function handleLogout() {
    await supabaseClient.auth.signOut();
  }

  // 2. Skicka chattmeddelande med Bearer Token & Timeout
  async function sendChat() {
    const input = document.getElementById('chat-input');
    const btnSend = document.getElementById('btn-send');
    const statusText = document.getElementById('chat-status');
    const messageText = input.value.trim();

    if (!messageText) return;

    // Hämta färsk session
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return alert('Sessionen har löpt ut. Logga in igen.');

    appendMessage('user', messageText);
    input.value = '';
    btnSend.disabled = true;
    statusText.innerText = 'FALK kognitiv motor vaknar...';

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);

    try {
      const response = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ message: messageText }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (!response.ok) {
        const err = await response.json();
        throw new Error(err.details || `Serverfel (${response.status})`);
      }

      const data = await response.json();
      appendMessage('falk', data.response);
      statusText.innerText = '';

    } catch (err) {
      if (err.name === 'AbortError') {
        alert('Timeout: Renders server tog för lång tid på sig att starta.');
      } else {
        alert('Fel: ' + err.message);
      }
      statusText.innerText = 'Kommunikationsfel.';
    } finally {
      btnSend.disabled = false;
    }
  }

  function appendMessage(sender, text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  // Register Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(err => console.error('SW Error:', err));
    });
  }
</script>
</body>
</html>
