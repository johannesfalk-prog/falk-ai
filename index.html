<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALK - Kognitiv Dagbok</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .app-container { width: 100%; max-width: 600px; background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; height: 85vh; }
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid #334155; margin-bottom: 16px; }
        .header h1 { font-size: 1.5rem; font-weight: 700; color: #38bdf8; }
        .user-info { font-size: 0.85rem; color: #94a3b8; }
        .chat-box { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 8px; margin-bottom: 16px; }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
        .user-message { background: #4f46e5; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background: #334155; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-group { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 14px; border-radius: 8px; color: white; font-size: 1rem; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 14px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s, opacity 0.2s; }
        button:hover:not(:disabled) { background: #7dd3fc; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .login-box { display: flex; flex-direction: column; gap: 12px; justify-content: center; height: 100%; text-align: center; }
        .login-box input { margin-bottom: 8px; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; }
        .hidden { display: none !important; }
        .status-text { font-size: 0.8rem; color: #64748b; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

<div class="app-container">
    <div id="auth-section" class="login-box">
        <h2 style="color: #38bdf8; margin-bottom: 12px;">Logga in på FALK</h2>
        <input type="email" id="email" placeholder="Din e-postadress">
        <input type="password" id="password" placeholder="Ditt lösenord">
        <button id="login-btn" onclick="handleLogin()">Logga in</button>
        <div id="auth-error" class="status-text" style="color: #ef4444;"></div>
    </div>

    <div id="chat-section" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
        <div class="header">
            <div>
                <h1>FALK <span style="font-size: 0.8rem; color: #4ade80;">[v2 Live]</span></h1>
                <div id="user-email" class="user-info"></div>
            </div>
            <button onclick="handleLogout()" style="background: #475569; color: white; padding: 8px 12px; font-size: 0.8rem;">Logga ut</button>
        </div>

        <div id="chat-box" class="chat-box"></div>

        <div class="input-group">
            <input type="text" id="message-input" placeholder="Skriv ditt meddelande till FALK..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()">Skicka</button>
        </div>
        <div id="status-indicator" class="status-text"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://dmerwpgvepkjirugnfzy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZXJ3cGd2ZXBramlydWduZnp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjM3NjksImV4cCI6MjEwNzk5OTc2OX0.UNX_fozGEsKKMrQpn-8VP3g3r1boegX5jl5B8oW69Ww";
    const BACKEND_URL = "https://falk-ai.onrender.com";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentSession = null;

    async function checkSession() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            setupAuthenticatedUser(session);
        }
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
        if (session) {
            setupAuthenticatedUser(session);
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('chat-section').classList.add('hidden');
            currentSession = null;
        }
    });

    async function handleLogin() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('auth-error');
        errorDiv.innerText = "";

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            errorDiv.innerText = error.message;
        }
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        document.getElementById('chat-box').innerHTML = "";
    }

    async function setupAuthenticatedUser(session) {
        currentSession = session;
        document.getElementById('auth-section').classList.add('hidden');
        document.getElementById('chat-section').classList.remove('hidden');
        document.getElementById('user-email').innerText = session.user.email;
        
        await loadHistory();
    }

    async function loadHistory() {
        if (!currentSession) return;
        const status = document.getElementById('status-indicator');
        status.innerText = "Hämtar dagbokshistorik...";

        try {
            const res = await fetch(`${BACKEND_URL}/history`, {
                headers: { 'Authorization': `Bearer ${currentSession.access_token}` }
            });
            const data = await res.json();

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "";

            if (data.history && data.history.length > 0) {
                data.history.forEach(entry => {
                    appendMessage(entry.user_message, 'user');
                    appendMessage(entry.ai_response, 'ai');
                });
                status.innerText = "";
            } else {
                status.innerText = "Inga tidigare inlägg funna. Starta din dagbok nedan.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (err) {
            status.innerText = "Kunde inte ladda historik.";
        }
    }

    function appendMessage(text, sender) {
        const chatBox = document.getElementById('chat-box');
        const msg = document.createElement('div');
        msg.className = `message ${sender === 'user' ? 'user-message' : 'ai-message'}`;
        msg.innerText = text;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('message-input');
        const btn = document.getElementById('send-btn');
        const status = document.getElementById('status-indicator');
        const text = input.value.trim();

        if (!text || !currentSession) return;

        input.disabled = true;
        btn.disabled = true;
        status.innerText = "FALK tänker...";

        appendMessage(text, 'user');
        input.value = "";

        try {
            const res = await fetch(`${BACKEND_URL}/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${currentSession.access_token}`
                },
                body: JSON.stringify({ message: text })
            });

            const data = await res.json();
            if (res.ok && data.response) {
                appendMessage(data.response, 'ai');
                status.innerText = "";
            } else {
                alert(`Fel: ${data.details || data.error || 'Något gick fel'}`);
                status.innerText = "Ett fel uppstod.";
            }
        } catch (err) {
            alert("Nätverksfel eller serveruppkoppling misslyckades.");
            status.innerText = "Kopplingsfel.";
        } finally {
            input.disabled = false;
            btn.disabled = false;
            input.focus();
        }
    }

    checkSession();
</script>
</body>
</html>
