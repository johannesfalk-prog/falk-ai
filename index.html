<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>FALK – Kognitiv Dagbok</title>
    
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline';
        worker-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        connect-src 'self' https://dmerwpgvepkjirugnfzy.supabase.co https://falk-ai.onrender.com wss://dmerwpgvepkjirugnfzy.supabase.co;
        img-src 'self' data: https: blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <script src="/js/purify.min.js"></script>
    <script src="/js/marked.min.js"></script>
    <script src="/js/supabase.js"></script>
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --user-msg: #4f46e5;
            --ai-msg: #1e293b;
            --border: #334155;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            height: 90dvh;
            background-color: #111827;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            padding: 16px 20px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .badge {
            font-size: 0.75rem;
            background: #059669;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .user-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-right: 8px;
        }

        .auth-container {
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
            flex-grow: 1;
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        .chat-history {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-break: break-word;
            overflow-wrap: anywhere;
        }

        .msg-user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg-ai {
            align-self: flex-start;
            background-color: var(--ai-msg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .msg-system-error {
            align-self: center;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: #fca5a5;
            font-size: 0.85rem;
            padding: 10px 16px;
            border-radius: 8px;
            text-align: center;
            width: 100%;
        }

        .msg-ai p { margin-bottom: 8px; }
        .msg-ai p:last-child { margin-bottom: 0; }
        .msg-ai ul, .msg-ai ol { margin-left: 20px; margin-bottom: 8px; }

        .chat-input-area {
            padding: 12px 16px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-input-area textarea {
            flex-grow: 1;
            height: 48px;
            min-height: 48px;
            max-height: 120px;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.4;
            outline: none;
            resize: none;
            word-break: normal;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }

        .chat-input-area textarea:focus { border-color: var(--accent); }

        .btn {
            padding: 12px 20px;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn:hover { background-color: var(--accent-hover); }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.85rem;
            height: auto;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>FALK <span class="badge">Production Ready</span></h1>
        <div id="user-header" class="hidden">
            <span id="user-email" class="user-info"></span>
            <button id="logout-btn" class="btn btn-logout">Logga ut</button>
        </div>
    </div>

    <!-- Auth View -->
    <div id="auth-view" class="auth-container">
        <h2>Logga in på FALK</h2>
        <form id="auth-form">
            <div class="input-group">
                <label for="email">Din e-postadress</label>
                <input type="email" id="email" name="email" autocomplete="username" required placeholder="namn@exempel.se">
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <label for="password">Ditt lösenord</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Logga in</button>
        </form>
    </div>

    <!-- Chat View -->
    <div id="chat-view" class="chat-history hidden"></div>

    <div id="input-view" class="chat-input-area hidden">
        <textarea id="chat-message" placeholder="Skriv ditt meddelande till FALK..."></textarea>
        <button id="send-btn" class="btn">Skicka</button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://dmerwpgvepkjirugnfzy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZXJ3cGd2ZXBramlydWduZnp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjM3NjksImV4cCI6MjEwNzk5OTc2OX0.UNX_fozGEsKKMrQpn-8VP3g3r1boegX5jl5B8oW69Ww";
    const BACKEND_URL = "https://falk-ai.onrender.com";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
        document.getElementById("auth-form").addEventListener("submit", handleAuth);
        document.getElementById("logout-btn").addEventListener("click", handleLogout);
        document.getElementById("send-btn").addEventListener("click", sendMessage);

        try {
            const { data: { session } } = await supabaseClient.auth.getSession().catch(() => ({ data: { session: null } }));
            if (session) {
                showChat(session);
            } else {
                const cachedUser = localStorage.getItem("falk_cached_user");
                if (cachedUser && !navigator.onLine) {
                    showChat({ user: { email: cachedUser } });
                }
            }
        } catch (e) {}

        supabaseClient.auth.onAuthStateChange((_event, session) => {
            if (session) {
                localStorage.setItem("falk_cached_user", session.user.email);
                showChat(session);
            } else if (navigator.onLine) {
                showAuth();
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
    });

    async function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert("Inloggningsfel: " + error.message);
        } catch (err) {
            alert("Nätverksfel vid inloggning.");
        }
    }

    async function handleLogout() {
        localStorage.removeItem("falk_cached_user");
        localStorage.removeItem("falk_chat_history");
        try { await supabaseClient.auth.signOut(); } catch (e) {}
        showAuth();
    }

    function showAuth() {
        document.getElementById("auth-view").classList.remove("hidden");
        document.getElementById("chat-view").classList.add("hidden");
        document.getElementById("input-view").classList.add("hidden");
        document.getElementById("user-header").classList.add("hidden");
    }

    async function showChat(session) {
        document.getElementById("auth-view").classList.add("hidden");
        document.getElementById("chat-view").classList.remove("hidden");
        document.getElementById("input-view").classList.remove("hidden");
        document.getElementById("user-header").classList.remove("hidden");
        document.getElementById("user-email").innerText = session.user.email;

        await loadHistory();
    }

    async function loadHistory() {
        const chatView = document.getElementById("chat-view");
        chatView.innerHTML = "";

        const cachedHistory = localStorage.getItem("falk_chat_history");
        if (cachedHistory) {
            try {
                const parsed = JSON.parse(cachedHistory);
                renderHistoryItems(parsed);
            } catch (e) {}
        }

        if (!navigator.onLine) return;

        try {
            const { data: { session } } = await supabaseClient.auth.getSession().catch(() => ({ data: { session: null } }));
            if (!session) return;

            const res = await fetch(`${BACKEND_URL}/history`, {
                headers: { "Authorization": `Bearer ${session.access_token}` }
            }).catch(() => null);

            if (res && res.ok) {
                const data = await res.json();
                if (data.history) {
                    localStorage.setItem("falk_chat_history", JSON.stringify(data.history));
                    chatView.innerHTML = "";
                    renderHistoryItems(data.history);
                }
            }
        } catch (err) {}
    }

    function renderHistoryItems(historyArray) {
        historyArray.forEach(entry => {
            appendMessage(entry.user_message, "user");
            appendMessage(entry.ai_response, "ai");
        });
    }

    async function sendMessage() {
        const input = document.getElementById("chat-message");
        const message = input.value.trim();
        if (!message) return;

        appendMessage(message, "user");
        input.value = "";

        if (!navigator.onLine) {
            input.value = message;
            appendMessage("Du är offline. Meddelandet ligger kvar i textfältet.", "system-error");
            return;
        }

        try {
            const { data: { session } } = await supabaseClient.auth.getSession().catch(() => ({ data: { session: null } }));
            if (!session) throw new Error("Ingen aktiv session");

            const res = await fetch(`${BACKEND_URL}/chat`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${session.access_token}`
                },
                body: JSON.stringify({ message })
            }).catch(() => null);

            if (!res || !res.ok) throw new Error("Serveranslutningsfel");

            const data = await res.json();
            if (data.response) {
                appendMessage(data.response, "ai");
                
                const cached = JSON.parse(localStorage.getItem("falk_chat_history") || "[]");
                cached.push({ user_message: message, ai_response: data.response });
                localStorage.setItem("falk_chat_history", JSON.stringify(cached));
            } else {
                throw new Error("Tomt svar");
            }
        } catch (err) {}
    }

    function appendMessage(text, sender) {
        const chatView = document.getElementById("chat-view");
        const div = document.createElement("div");

        if (sender === "system-error") {
            div.classList.add("msg-system-error");
            div.textContent = text;
        } else {
            div.classList.add("msg-bubble", sender === "user" ? "msg-user" : "msg-ai");
            if (sender === "ai") {
                div.innerHTML = DOMPurify.sanitize(marked.parse(text));
            } else {
                div.textContent = text;
            }
        }

        chatView.appendChild(div);
        chatView.scrollTop = chatView.scrollHeight;
    }
</script>
</body>
</html>
