<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FALK – Kognitiv Dagbok</title>
    
    <!-- Skottsäker, komplett Content Security Policy för alla aktiva resurser -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: blob:;
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://*.supabase.co;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        connect-src 'self' https://dmerwpgvepkjirugnfzy.supabase.co https://falk-ai.onrender.com wss://dmerwpgvepkjirugnfzy.supabase.co https://cdn.jsdelivr.net https://cdn-icons-png.flaticon.com;
        img-src 'self' data: https: blob: https://cdn-icons-png.flaticon.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --user-msg: #4f46e5;
            --ai-msg: #1e293b;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            background-color: #111827;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            padding: 16px 20px;
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header .badge {
            font-size: 0.75rem;
            background: #059669;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .user-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-right: 8px;
        }

        .auth-container {
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            justify-content: center;
            flex-grow: 1;
        }

        .auth-container h2 {
            text-align: center;
            margin-bottom: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--accent);
        }

        .btn {
            padding: 12px 20px;
            background-color: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .chat-history {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .msg-user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg-ai {
            align-self: flex-start;
            background-color: var(--ai-msg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .msg-ai p { margin-bottom: 8px; }
        .msg-ai p:last-child { margin-bottom: 0; }
        .msg-ai ul, .msg-ai ol { margin-left: 20px; margin-bottom: 8px; }

        .chat-input-area {
            padding: 16px;
            background-color: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }

        .chat-input-area textarea {
            resize: none;
            height: 50px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>FALK <span class="badge">Production Ready</span></h1>
        <div id="user-header" class="hidden">
            <span id="user-email" class="user-info"></span>
            <button id="logout-btn" class="btn btn-logout">Logga ut</button>
        </div>
    </div>

    <!-- Auth View -->
    <div id="auth-view" class="auth-container">
        <h2>Logga in på FALK</h2>
        <form id="auth-form">
            <div class="input-group">
                <label for="email">Din e-postadress</label>
                <input type="email" id="email" name="email" autocomplete="username" required placeholder="namn@exempel.se">
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <label for="password">Ditt lösenord</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Logga in</button>
        </form>
    </div>

    <!-- Chat View -->
    <div id="chat-view" class="chat-history hidden"></div>

    <div id="input-view" class="chat-input-area hidden">
        <textarea id="chat-message" placeholder="Skriv ditt meddelande till FALK..."></textarea>
        <button id="send-btn" class="btn">Skicka</button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://dmerwpgvepkjirugnfzy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtZXJ3cGd2ZXBramlydWduZnp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0MjM3NjksImV4cCI6MjEwNzk5OTc2OX0.UNX_fozGEsKKMrQpn-8VP3g3r1boegX5jl5B8oW69Ww";
    const BACKEND_URL = "https://falk-ai.onrender.com";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.addEventListener("DOMContentLoaded", async () => {
        document.getElementById("auth-form").addEventListener("submit", handleAuth);
        document.getElementById("logout-btn").addEventListener("click", handleLogout);
        document.getElementById("send-btn").addEventListener("click", sendMessage);

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) {
            showChat(session);
        }

        supabaseClient.auth.onAuthStateChange((_event, session) => {
            if (session) {
                showChat(session);
            } else {
                showAuth();
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.error("SW Reg Error:", err));
        }
    });

    async function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) {
            alert("Inloggningsfel: " + error.message);
        }
    }

    async function handleLogout() {
        await supabaseClient.auth.signOut();
        showAuth();
    }

    function showAuth() {
        document.getElementById("auth-view").classList.remove("hidden");
        document.getElementById("chat-view").classList.add("hidden");
        document.getElementById("input-view").classList.add("hidden");
        document.getElementById("user-header").classList.add("hidden");
    }

    async function showChat(session) {
        document.getElementById("auth-view").classList.add("hidden");
        document.getElementById("chat-view").classList.remove("hidden");
        document.getElementById("input-view").classList.remove("hidden");
        document.getElementById("user-header").classList.remove("hidden");
        document.getElementById("user-email").innerText = session.user.email;

        await loadHistory();
    }

    async function loadHistory() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;

        try {
            const res = await fetch(`${BACKEND_URL}/history`, {
                headers: { "Authorization": `Bearer ${session.access_token}` }
            });
            const data = await res.json();
            
            const chatView = document.getElementById("chat-view");
            chatView.innerHTML = "";

            if (data.history) {
                data.history.forEach(entry => {
                    appendMessage(entry.user_message, "user");
                    appendMessage(entry.ai_response, "ai");
                });
                chatView.scrollTop = chatView.scrollHeight;
            }
        } catch (err) {
            console.error("Fel vid hämtning av historik:", err);
        }
    }

    async function sendMessage() {
        const input = document.getElementById("chat-message");
        const message = input.value.trim();
        if (!message) return;

        input.value = "";
        appendMessage(message, "user");

        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) return;

        try {
            const res = await fetch(`${BACKEND_URL}/chat`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${session.access_token}`
                },
                body: JSON.stringify({ message })
            });

            const data = await res.json();
            if (data.response) {
                appendMessage(data.response, "ai");
            } else if (data.error) {
                appendMessage("Fel: " + data.error, "ai");
            }
        } catch (err) {
            appendMessage("Kunde inte nå servern.", "ai");
        }
    }

    function appendMessage(text, sender) {
        const chatView = document.getElementById("chat-view");
        const div = document.createElement("div");
        div.classList.add("msg-bubble", sender === "user" ? "msg-user" : "msg-ai");

        if (sender === "ai") {
            const cleanHtml = DOMPurify.sanitize(marked.parse(text));
            div.innerHTML = cleanHtml;
        } else {
            div.textContent = text;
        }

        chatView.appendChild(div);
        chatView.scrollTop = chatView.scrollHeight;
    }
</script>
</body>
</html>
