<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FALK - Digital Mentor</title>
    <style>
        :root {
            --bg-color: #f4f6f8;
            --chat-bg: #ffffff;
            --user-msg: #0066ff;
            --bot-msg: #f0f2f5;
            --text-main: #1c1e21;
            --text-muted: #65676b;
            --border-color: #e4e6eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; height: 100vh; }

        .app-container { width: 100%; max-width: 800px; background: var(--chat-bg); display: flex; flex-direction: column; height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .header h1 { font-size: 1.2rem; font-weight: 700; color: #111; }

        .chat-window { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .message-bubble { max-width: 80%; padding: 14px 18px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .message-bubble.user { align-self: flex-end; background-color: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
        .message-bubble.bot { align-self: flex-start; background-color: var(--bot-msg); color: var(--text-main); border-bottom-left-radius: 4px; }

        .input-area { padding: 16px 24px; border-top: 1px solid var(--border-color); background: #fff; display: flex; gap: 12px; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 24px; outline: none; font-size: 0.95rem; }
        .input-area input:focus { border-color: var(--user-msg); }
        .input-area button { padding: 12px 20px; background-color: var(--user-msg); color: #fff; border: none; border-radius: 24px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        .input-area button:hover { opacity: 0.9; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>FALK-Light</h1>
        <button id="clear-btn" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.85rem;">+ Ny chatt</button>
    </div>

    <div class="chat-window" id="chat-window">
        <div class="message-bubble bot">Jag är FALK - Min uppgift är att hjälpa dig på din väg!<br><br>Vad vill du utforska idag?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Skriv ett meddelande..." autocomplete="off">
        <button id="send-btn">Skicka</button>
    </div>
</div>

<script>
    const API_URL = 'https://falk-ai.onrender.com/chat';
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');

    // Initiera session-ID om det saknas
    if (!localStorage.getItem('falk_session_id')) {
        localStorage.setItem('falk_session_id', crypto.randomUUID());
    }

    function appendMessage(sender, text) {
        const bubble = document.createElement('div');
        bubble.className = `message-bubble ${sender}`;
        bubble.innerHTML = text.replace(/\n/g, '<br>');
        chatWindow.appendChild(bubble);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    function getStoredProfile() {
        try {
            const raw = localStorage.getItem('falk_user_profile');
            return raw ? JSON.parse(raw) : {};
        } catch (e) {
            console.error('Kunde inte läsa falk_user_profile från LocalStorage:', e);
            return {};
        }
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        const currentProfile = getStoredProfile();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    user_profile: currentProfile
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP status ${response.status}`);
            }

            const data = await response.json();

            if (data && data.response) {
                appendMessage('bot', data.response);

                if (data.user_profile && typeof data.user_profile === 'object') {
                    localStorage.setItem('falk_user_profile', JSON.stringify(data.user_profile));
                    console.log('falk_user_profile uppdaterad i LocalStorage:', data.user_profile);
                }
            } else {
                throw new Error('Inget giltigt response-fält i JSON-payload');
            }

        } catch (error) {
            console.error('Chat error:', error);
            appendMessage('bot', 'Kunde inte generera ett svar. Vad vill du att vi utforskar kring detta?');
        } finally {
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') handleSend();
    });

    clearBtn.addEventListener('click', () => {
        chatWindow.innerHTML = '<div class="message-bubble bot">Jag är FALK - Min uppgift är att hjälpa dig på din väg!<br><br>Vad vill du utforska idag?</div>';
    });
</script>

</body>
</html>
