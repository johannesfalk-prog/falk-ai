<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FALK - Digital Mentor (Light)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 10px; }
    .chat-card { background: #ffffff; width: 100%; max-width: 480px; height: 90vh; max-height: 680px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #1a1a1a; color: #ffffff; padding: 20px; font-weight: 600; font-size: 1.1rem; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
    .chat-header span { font-size: 0.75rem; background: #333; padding: 4px 8px; border-radius: 4px; color: #aaa; text-transform: uppercase; }
    .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg-wrapper { display: flex; flex-direction: column; gap: 4px; max-width: 85%; }
    .msg-wrapper.user { align-self: flex-end; }
    .msg-wrapper.bot { align-self: flex-start; }
    .msg { padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.45; word-wrap: break-word; }
    .msg-wrapper.user .msg { background: #0066ff; color: #ffffff; border-bottom-right-radius: 2px; }
    .msg-wrapper.bot .msg { background: #f0f1f3; color: #1a1a1a; border-bottom-left-radius: 2px; }
    .msg.status { background: transparent; color: #888; font-size: 0.85rem; font-style: italic; text-align: center; align-self: center; }
    .yt-container { width: 100%; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .yt-player { width: 100%; height: 200px; border-radius: 8px; border: none; }
    .yt-fallback-link { font-size: 0.75rem; color: #0066ff; text-decoration: underline; margin-left: 2px; }
    .feedback-actions { display: flex; gap: 6px; font-size: 0.75rem; color: #888; margin-top: 2px; margin-left: 4px; }
    .feedback-btn { background: none; border: none; cursor: pointer; opacity: 0.6; transition: opacity 0.2s; font-size: 0.85rem; padding: 2px 4px; }
    .feedback-btn:hover { opacity: 1.0; }
    .chat-footer { padding: 16px; border-top: 1px solid #eee; display: flex; gap: 8px; background: #fafafa; }
    input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #0066ff; }
    button.send-btn { background: #1a1a1a; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    button.send-btn:hover { background: #333; }
    button:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="chat-header">
    FALK-Light <span>powered by WAYJS</span>
  </div>
  <div class="chat-body" id="chat">
    <div class="msg-wrapper bot">
      <div class="msg">Välkommen, hur kan jag hjälpa dig eller vad funderar du på?</div>
    </div>
  </div>
  <div class="chat-footer">
    <input type="text" id="input" placeholder="Skriv ditt meddelande..." onkeydown="if(event.key==='Enter') send()">
    <button class="send-btn" id="send-btn" onclick="send()">Skicka</button>
  </div>
</div>

<script>
  const API_URL = "https://falk-ai.onrender.com/chat";
  const FEEDBACK_URL = "https://falk-ai.onrender.com/feedback";
  let history = JSON.parse(sessionStorage.getItem("falk_light_history") || "[]");

  window.onload = () => {
    history.forEach(msg => {
      appendMessage(msg.content, msg.role === "user" ? "user" : "bot", true);
    });
  };

  async function send() {
    const input = document.getElementById("input");
    const btn = document.getElementById("send-btn");
    const chat = document.getElementById("chat");
    const text = input.value.trim();

    if (!text) return;

    appendMessage(text, "user", false);
    input.value = "";
    input.disabled = true;
    btn.disabled = true;

    const loadingElem = appendStatusMessage("Falk tänker...");
    chat.scrollTop = chat.scrollHeight;

    const coldStartTimer = setTimeout(() => {
      loadingElem.innerText = "Väcker servern (detta kan ta ~30 sekunder vid första anropet)...";
    }, 3500);

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, history: history })
      });

      clearTimeout(coldStartTimer);
      loadingElem.remove();

      if (!res.ok) {
        appendMessage("Ett fel uppstod på servern.", "bot", false);
        return;
      }

      const { wrapperElem, msgElem } = createBotMessagePlaceholder();
      let fullReply = "";

      const reader = res.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n\n");
        buffer = lines.pop() || "";

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const dataStr = line.replace("data: ", "").trim();
            if (dataStr === "[DONE]") break;

            try {
              const data = JSON.parse(dataStr);
              if (data.token) {
                fullReply += data.token;
                msgElem.innerText = fullReply;
                chat.scrollTop = chat.scrollHeight;
              }
            } catch (e) {}
          }
        }
      }

      if (!fullReply.trim()) {
        fullReply = "Kunde inte generera ett svar. Vad vill du att vi utforskar kring detta?";
        msgElem.innerText = fullReply;
      }

      parseAndEmbedMedia(wrapperElem, msgElem, fullReply);
      attachFeedbackButtons(wrapperElem, fullReply);

      history.push({ role: "user", content: text });
      history.push({ role: "assistant", content: fullReply });
      if (history.length > 16) history = history.slice(-16);
      sessionStorage.setItem("falk_light_history", JSON.stringify(history));

    } catch (err) {
      clearTimeout(coldStartTimer);
      loadingElem.remove();
      appendMessage("Kunde inte ansluta till Falk.", "bot", false);
    } finally {
      input.disabled = false;
      btn.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  }

  function parseAndEmbedMedia(wrapperElem, msgElem, text) {
    const match = text.match(/(?:v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (match && match[1]) {
      const videoId = match[1];
      const rawUrl = `https://www.youtube.com/watch?v=${videoId}`;
      
      const cleanText = text.replace(/https?:\/\/[^\s]+/g, '').trim();
      msgElem.innerText = cleanText || "Här är ditt lugnande spår:";

      if (!wrapperElem.querySelector(".yt-container")) {
        const container = document.createElement("div");
        container.className = "yt-container";

        const iframe = document.createElement("iframe");
        iframe.className = "yt-player";
        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;

        const fallback = document.createElement("a");
        fallback.className = "yt-fallback-link";
        fallback.href = rawUrl;
        fallback.target = "_blank";
        fallback.innerText = "Öppna i YouTube om spelaren inte laddas ↗";

        container.appendChild(iframe);
        container.appendChild(fallback);
        wrapperElem.appendChild(container);
      }
    }
  }

  function appendMessage(text, role, renderMedia = false) {
    const chat = document.getElementById("chat");
    const wrapper = document.createElement("div");
    wrapper.className = `msg-wrapper ${role}`;
    
    const msg = document.createElement("div");
    msg.className = "msg";
    msg.innerText = text;
    wrapper.appendChild(msg);

    if (role === "bot") {
      if (renderMedia) {
        parseAndEmbedMedia(wrapper, msg, text);
      }
      attachFeedbackButtons(wrapper, text);
    }

    chat.appendChild(wrapper);
    chat.scrollTop = chat.scrollHeight;
    return wrapper;
  }

  function createBotMessagePlaceholder() {
    const chat = document.getElementById("chat");
    const wrapperElem = document.createElement("div");
    wrapperElem.className = "msg-wrapper bot";
    const msgElem = document.createElement("div");
    msgElem.className = "msg";
    wrapperElem.appendChild(msgElem);
    chat.appendChild(wrapperElem);
    return { wrapperElem, msgElem };
  }

  function appendStatusMessage(text) {
    const chat = document.getElementById("chat");
    const msg = document.createElement("div");
    msg.className = "msg status";
    msg.innerText = text;
    chat.appendChild(msg);
    return msg;
  }

  function attachFeedbackButtons(wrapperElem, replyText) {
    if (wrapperElem.querySelector(".feedback-actions")) return;
    const actions = document.createElement("div");
    actions.className = "feedback-actions";
    actions.innerHTML = `
      <button class="feedback-btn" onclick="sendFeedback(this, 'up', \`${escapeQuotes(replyText)}\`)">👍</button>
      <button class="feedback-btn" onclick="sendFeedback(this, 'down', \`${escapeQuotes(replyText)}\`)">👎</button>
    `;
    wrapperElem.appendChild(actions);
  }

  function escapeQuotes(str) {
    return str.replace(/`/g, '\\`').replace(/\$/g, '\\$');
  }

  async function sendFeedback(btn, rating, replyText) {
    const parent = btn.parentElement;
    parent.innerHTML = "<span>Tack för feedback!</span>";

    try {
      await fetch(FEEDBACK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rating: rating, reply: replyText })
      });
    } catch (e) {}
  }
</script>

</body>
</html>
