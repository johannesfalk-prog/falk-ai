<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <title>FALK - Digital Mentor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧠</text></svg>">
    <style>
        :root {
            --bg-color: #f4f6f8;
            --chat-bg: #ffffff;
            --user-msg: #0066ff;
            --bot-msg: #f0f2f5;
            --text-main: #1c1e21;
            --text-muted: #65676b;
            --border-color: #e4e6eb;
            --accent-color: #0066ff;
            --accent-light: #eef5ff;
            --danger-color: #dc3545;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            display: flex; 
            justify-content: center; 
            height: 100vh; 
            height: 100dvh; 
            overflow: hidden; 
        }

        .app-layout { 
            width: 100%; 
            max-width: 900px; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            height: 100dvh; 
            background: var(--chat-bg); 
            box-shadow: 0 0 20px rgba(0,0,0,0.05); 
            position: relative; 
        }

        .main-chat { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }

        .header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: #fff; z-index: 10; }
        .header-brand { font-size: 1.1rem; font-weight: 700; color: #111; }
        
        .btn-new-chat { padding: 6px 14px; background-color: #fff; border: 2px solid var(--accent-color); color: var(--accent-color); border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn-new-chat:hover { background-color: var(--accent-light); }

        .memory-toggle-btn { padding: 6px 12px; background: var(--accent-light); border: 1px solid var(--accent-color); color: var(--accent-color); border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; position: relative; }
        .memory-badge { width: 8px; height: 8px; background-color: #ff3b30; border-radius: 50%; display: none; }
        .memory-badge.pulse { display: inline-block; animation: pulse-anim 1.5s infinite; }

        @keyframes pulse-anim {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.7); }
            70% { transform: scale(1.2); box-shadow: 0 0 0 6px rgba(255, 59, 48, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 59, 48, 0); }
        }

        .chat-window { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        
        .bot-wrapper { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; max-width: 88%; }
        
        .message-bubble { padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .message-bubble.user { align-self: flex-end; max-width: 85%; background-color: var(--user-msg); color: #fff; border-bottom-right-radius: 4px; }
        .message-bubble.bot { background-color: var(--bot-msg); color: var(--text-main); border-bottom-left-radius: 4px; width: 100%; transition: opacity 0.2s; }
        .message-bubble.bot.error-msg { background-color: #fff0f1; border: 1px solid #ffccd1; color: var(--danger-color); }
        .message-bubble.loading { background-color: var(--bot-msg); color: var(--text-muted); font-style: italic; animation: pulse-bg 1.2s infinite ease-in-out; }

        .message-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-left: 4px; }
        .action-btn { background: #ffffff; border: 1px solid var(--border-color); color: var(--text-muted); border-radius: 14px; padding: 4px 10px; font-size: 0.75rem; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.15s ease; }
        .action-btn:hover { background: var(--accent-light); color: var(--accent-color); border-color: var(--accent-color); }
        .action-btn.active { background: var(--accent-light); color: var(--accent-color); border-color: var(--accent-color); font-weight: 700; }
        .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        @keyframes pulse-bg {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .onboarding-container { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; width: 100%; max-width: 600px; }
        .onboarding-card { padding: 12px 14px; background: #fff; border: 1px solid var(--border-color); border-radius: 12px; font-size: 0.88rem; color: var(--text-main); text-align: left; cursor: pointer; transition: all 0.2s; line-height: 1.4; }
        .onboarding-card:hover { border-color: var(--accent-color); background: var(--accent-light); color: var(--accent-color); }

        .input-container { 
            padding: 10px 16px calc(12px + env(safe-area-inset-bottom)) 16px; 
            border-top: 1px solid var(--border-color); 
            background: #fff; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
        }
        .input-area { display: flex; gap: 8px; align-items: flex-end; }
        
        .input-area textarea { 
            flex: 1; 
            padding: 10px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: 18px; 
            outline: none; 
            font-size: 0.95rem; 
            font-family: inherit; 
            resize: none; 
            min-height: 42px; 
            max-height: 180px; 
            line-height: 1.4; 
            overflow-y: auto; 
        }
        .input-area textarea:focus { border-color: var(--user-msg); }
        .input-area textarea:disabled { background-color: #f8f9fa; cursor: not-allowed; }
        
        .input-area button { padding: 10px 20px; height: 42px; background-color: var(--user-msg); color: #fff; border: none; border-radius: 24px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; flex-shrink: 0; }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        .footer-credit { font-size: 0.72rem; color: var(--text-muted); text-align: center; font-weight: 500; letter-spacing: 0.3px; }

        .memory-panel { position: fixed; top: 0; right: -360px; width: 320px; height: 100vh; height: 100dvh; background: #fafbfc; border-left: 1px solid var(--border-color); box-shadow: -5px 0 25px rgba(0,0,0,0.08); transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 1000; display: flex; flex-direction: column; }
        .memory-panel.open { right: 0; }

        .memory-header { padding: 16px 20px; border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .close-memory-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted); }

        .memory-content { padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .memory-section { display: flex; flex-direction: column; gap: 8px; }
        .memory-section h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        .memory-card-box { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; font-size: 0.88rem; line-height: 1.4; }

        .tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { background: var(--accent-light); color: var(--accent-color); padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }

        .clear-memory-btn { width: 100%; padding: 10px; background: none; border: 1px solid var(--danger-color); color: var(--danger-color); border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-top: auto; transition: background 0.2s; }
        .clear-memory-btn:hover { background: #fff0f1; }
    </style>
</head>
<body>

<div class="app-layout">
    <div class="main-chat">
        <div class="header">
            <div class="header-brand">FALK-Light</div>
            <button id="clear-btn" class="btn-new-chat">+ Ny chatt</button>
            <button id="toggle-memory-btn" class="memory-toggle-btn">
                <span>🧠 Minne</span>
                <span id="memory-badge" class="memory-badge"></span>
            </button>
        </div>

        <div class="chat-window" id="chat-window">
            <div class="bot-wrapper">
                <div class="message-bubble bot">
                    Jag är FALK - Min uppgift är att hjälpa dig på din väg!<br><br>Vad vill du utforska idag?
                </div>
            </div>
            
            <div class="onboarding-container" id="onboarding-container">
                <button class="onboarding-card" data-prompt="Jag har alldeles för mycket i huvudet och behöver sortera vad som är viktigast just nu.">
                    🧠 <strong>Kognitiv Överbelastning:</strong> "Jag har för mycket i huvudet och behöver sortera..."
                </button>
                <button class="onboarding-card" data-prompt="Jag står inför ett svårt beslut och behöver skilja på vad jag borde göra och vad jag faktiskt vill.">
                    🧭 <strong>Beslutsångest & Val:</strong> "Jag står inför ett svårt beslut och vill sortera mina prioriteringar..."
                </button>
                <button class="onboarding-card" data-prompt="Jag stör mig på en situation eller person och vill förstå vad i min reaktion som jag kan påverka.">
                    💬 <strong>Friktion & Relationer:</strong> "Jag stör mig på en situation/person och vill förstå min egen reaktion..."
                </button>
                <button class="onboarding-card" data-prompt="Jag märker att jag upprepar ett beteende som inte tjänar mig, men jag vet inte hur jag bryter det.">
                    ⚡ <strong>Mönster & Förändring:</strong> "Jag upprepar ett beteende som inte tjänar mig och vill bryta det..."
                </button>
            </div>
        </div>

        <div class="input-container">
            <div class="input-area">
                <textarea id="user-input" rows="1" placeholder="Skriv ett meddelande..."></textarea>
                <button id="send-btn">Skicka</button>
            </div>
            <div class="footer-credit">Powered by WAYJS</div>
        </div>
    </div>

    <div class="memory-panel" id="memory-panel">
        <div class="memory-header">
            <span>🧠 Kognitiv Profil</span>
            <button id="close-memory-btn" class="close-memory-btn">&times;</button>
        </div>
        <div class="memory-content">
            <div class="memory-section">
                <h4>Kärnvärderingar</h4>
                <div class="tag-cloud" id="mem-varderingar">
                    <span style="font-size:0.8rem; color:var(--text-muted);">Inga ännu</span>
                </div>
            </div>

            <div class="memory-section">
                <h4>Identifierade Mönster</h4>
                <div class="memory-card-box" id="mem-monster">
                    <span style="color:var(--text-muted);">Inga reaktionsmönster registrerade.</span>
                </div>
            </div>

            <div class="memory-section">
                <h4>Aktuellt Fokus</h4>
                <div class="memory-card-box" id="mem-fokus">
                    <span style="color:var(--text-muted);">Odefinierat</span>
                </div>
            </div>

            <div class="memory-section">
                <h4>Senaste Insikt</h4>
                <div class="memory-card-box" id="mem-insikt">
                    <span style="color:var(--text-muted);">Ingen ännu</span>
                </div>
            </div>

            <button id="clear-memory-btn" class="clear-memory-btn">Rensa Kognitivt Minne</button>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://falk-ai.onrender.com/chat';
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');
    const onboardingContainer = document.getElementById('onboarding-container');
    const memoryPanel = document.getElementById('memory-panel');
    const toggleMemoryBtn = document.getElementById('toggle-memory-btn');
    const closeMemoryBtn = document.getElementById('close-memory-btn');
    const memoryBadge = document.getElementById('memory-badge');
    const clearMemoryBtn = document.getElementById('clear-memory-btn');

    let lastUserMessage = "";

    if (!localStorage.getItem('falk_session_id')) {
        localStorage.setItem('falk_session_id', crypto.randomUUID());
    }

    userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
    });

    function formatText(text) {
        if (!text) return '';
        let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        return formatted.replace(/\n/g, '<br>');
    }

    function appendMessage(sender, text, isLoading = false, isError = false) {
        if (sender === 'user') {
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble user';
            bubble.innerHTML = formatText(text);
            chatWindow.appendChild(bubble);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return null;
        } else {
            const wrapper = document.createElement('div');
            wrapper.className = 'bot-wrapper';
            
            const bubble = document.createElement('div');
            bubble.className = `message-bubble bot ${isLoading ? 'loading' : ''} ${isError ? 'error-msg' : ''}`;
            if (isLoading) bubble.id = 'loading-bubble';
            bubble.innerHTML = formatText(text);
            wrapper.appendChild(bubble);

            if (!isLoading && !isError) {
                appendActionButtons(wrapper);
            }
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;
            return wrapper;
        }
    }

    function appendActionButtons(wrapper) {
        let actionsContainer = wrapper.querySelector('.message-actions');
        if (!actionsContainer) {
            actionsContainer = document.createElement('div');
            actionsContainer.className = 'message-actions';
            wrapper.appendChild(actionsContainer);
        }
        actionsContainer.innerHTML = `
            <button class="action-btn" onclick="toggleFeedback(this, 'up')">👍</button>
            <button class="action-btn" onclick="toggleFeedback(this, 'down')">👎</button>
            <button class="action-btn" onclick="handleModifierClick(this, 'regenerate')">🔄 Nytt svar</button>
            <button class="action-btn" onclick="handleModifierClick(this, 'shorter')">➖ Kortare</button>
            <button class="action-btn" onclick="handleModifierClick(this, 'longer')">➕ Längre</button>
        `;
    }

    window.toggleFeedback = function(btn, type) {
        const parent = btn.parentElement;
        parent.querySelectorAll('.action-btn').forEach(b => {
            if (b.textContent.includes('👍') || b.textContent.includes('👎')) b.classList.remove('active');
        });
        btn.classList.add('active');
    };

    function removeLoadingBubble() {
        const loadingBubble = document.getElementById('loading-bubble');
        if (loadingBubble && loadingBubble.parentElement) {
            loadingBubble.parentElement.remove();
        }
    }

    function getStoredProfile() {
        try {
            const raw = localStorage.getItem('falk_user_profile');
            return raw ? JSON.parse(raw) : {};
        } catch (e) {
            console.error('Fel vid läsning av falk_user_profile:', e);
            return {};
        }
    }

    function renderMemoryPanel() {
        const profile = getStoredProfile();

        const varderingarEl = document.getElementById('mem-varderingar');
        if (profile.varderingar && profile.varderingar.length > 0) {
            varderingarEl.innerHTML = profile.varderingar.map(v => `<span class="tag">${v}</span>`).join('');
        } else {
            varderingarEl.innerHTML = '<span style="font-size:0.8rem; color:var(--text-muted);">Inga ännu</span>';
        }

        const monsterEl = document.getElementById('mem-monster');
        if (profile.identifierade_monster && profile.identifierade_monster.length > 0) {
            monsterEl.innerHTML = '<ul style="padding-left:16px;">' + profile.identifierade_monster.map(m => `<li>${m}</li>`).join('') + '</ul>';
        } else {
            monsterEl.innerHTML = '<span style="color:var(--text-muted);">Inga reaktionsmönster registrerade.</span>';
        }

        document.getElementById('mem-fokus').textContent = profile.aktuellt_fokus || 'Odefinierat';
        document.getElementById('mem-insikt').textContent = profile.senaste_insikt || 'Ingen ännu';
    }

    window.handleModifierClick = async function(btnElement, modifier) {
        if (!lastUserMessage) return;

        const targetWrapper = btnElement.closest('.bot-wrapper');
        const bubble = targetWrapper.querySelector('.message-bubble');
        const originalContent = bubble.innerHTML;

        targetWrapper.querySelectorAll('.action-btn').forEach(b => b.disabled = true);
        bubble.classList.add('loading');
        bubble.textContent = 'FALK analyserar och formulerar om svaret...';

        userInput.disabled = true;
        sendBtn.disabled = true;

        const currentProfile = getStoredProfile();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: lastUserMessage,
                    user_profile: currentProfile,
                    modifier: modifier
                })
            });

            if (!response.ok) throw new Error(`HTTP status ${response.status}`);

            const data = await response.json();

            bubble.classList.remove('loading');

            if (data && data.response) {
                bubble.innerHTML = formatText(data.response);

                if (data.user_profile && typeof data.user_profile === 'object') {
                    localStorage.setItem('falk_user_profile', JSON.stringify(data.user_profile));
                    renderMemoryPanel();
                }
            } else {
                throw new Error('Inget giltigt response-fält i JSON');
            }
        } catch (error) {
            console.error('Chat error:', error);
            bubble.classList.remove('loading');
            bubble.innerHTML = originalContent;
            alert('Kunde inte generera om svaret. Kontrollera din anslutning.');
        } finally {
            targetWrapper.querySelectorAll('.action-btn').forEach(b => b.disabled = false);
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    };

    async function handleSend(textToSend) {
        const text = textToSend || userInput.value.trim();
        if (!text) return;

        if (onboardingContainer) {
            onboardingContainer.style.display = 'none';
        }

        appendMessage('user', text);
        userInput.value = '';
        userInput.style.height = 'auto';

        lastUserMessage = text;
        userInput.disabled = true;
        sendBtn.disabled = true;

        appendMessage('bot', 'FALK analyserar och tänker...', true);
        const coldStartTimer = setTimeout(() => {
            const currentBubble = document.getElementById('loading-bubble');
            if (currentBubble) {
                currentBubble.textContent = 'Väcker FALK-motorn (Cold Start)...';
            }
        }, 5000);

        const currentProfile = getStoredProfile();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: text,
                    user_profile: currentProfile
                })
            });

            if (!response.ok) throw new Error(`HTTP status ${response.status}`);

            const data = await response.json();

            removeLoadingBubble();

            if (data && data.response) {
                appendMessage('bot', data.response, false, false);

                if (data.user_profile && typeof data.user_profile === 'object') {
                    localStorage.setItem('falk_user_profile', JSON.stringify(data.user_profile));
                    renderMemoryPanel();
                    
                    if (!memoryPanel.classList.contains('open')) {
                        memoryBadge.classList.add('pulse');
                    }
                }
            } else {
                throw new Error('Inget giltigt response-fält i JSON');
            }
        } catch (error) {
            console.error('Chat error:', error);
            removeLoadingBubble();
            userInput.value = text;
            appendMessage('bot', 'Kunde inte ansluta till FALK-motorn. Kontrollera din anslutning och försök igen.', false, true);
        } finally {
            clearTimeout(coldStartTimer);
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    sendBtn.addEventListener('click', () => handleSend());
    
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    document.querySelectorAll('.onboarding-card').forEach(card => {
        card.addEventListener('click', () => {
            const prompt = card.getAttribute('data-prompt');
            handleSend(prompt);
        });
    });

    clearBtn.addEventListener('click', () => {
        chatWindow.innerHTML = `
            <div class="bot-wrapper">
                <div class="message-bubble bot">
                    Jag är FALK - Min uppgift är att hjälpa dig på din väg!<br><br>Vad vill du utforska idag?
                </div>
            </div>
        `;
        if (onboardingContainer) {
            chatWindow.appendChild(onboardingContainer);
            onboardingContainer.style.display = 'flex';
        }
    });

    toggleMemoryBtn.addEventListener('click', () => {
        memoryPanel.classList.toggle('open');
        memoryBadge.classList.remove('pulse');
    });

    closeMemoryBtn.addEventListener('click', () => {
        memoryPanel.classList.remove('open');
    });

    clearMemoryBtn.addEventListener('click', () => {
        if (confirm('Vill du helt rensa din kognitiva minnesprofil?')) {
            localStorage.removeItem('falk_user_profile');
            renderMemoryPanel();
        }
    });

    renderMemoryPanel();
</script>

</body>
</html>
